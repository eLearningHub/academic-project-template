name: Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - uses: prefix-dev/setup-pixi@v0.8.1
      with:
        pixi-version: v0.72.2
        cache: true

    - name: Lint with ruff
      run: pixi run lint

    - name: Check formatting with ruff
      run: pixi run format-check

    - name: Type check with mypy
      run: pixi run mypy
